name: Deploy Learning Portal

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [content-update]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: Build MkDocs Site
    runs-on: ubuntu-latest
    steps:
      # ── Log trigger source (from your sample) ─────────────────
      - name: Log trigger context
        run: |
          echo "=== Build Triggered ==="
          echo "Event:        ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "Source repo:  ${{ github.event.client_payload.source_repo }}"
            echo "Branch:       ${{ github.event.client_payload.source_branch }}"
            echo "Commit SHA:   ${{ github.event.client_payload.commit_sha }}"
            echo "Triggered by: ${{ github.event.client_payload.triggered_by }}"
          fi
          echo "======================="

      - name: Checkout portal repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ⚡ Added Caching for speed
      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install MkDocs dependencies
        run: pip install -r requirements.txt

      # ── Improved Cloning: Handing the Monorepo ────────────────
      - name: Clone knowledge-base monorepo
        run: |
          echo "→ Cloning senvishal02/knowledge-base into temporary directory"
          git clone --depth 1 --quiet https://github.com/senvishal02/knowledge-base.git _kb

      - name: Mount content into docs/
        run: |
          # Creates folders and moves content from the monorepo
          mkdir -p docs/courses docs/labs docs/interview-prep docs/projects docs/cheatsheets docs/roadmap docs/blog
          
          echo "=== Mounting content ==="
          cp -r _kb/courses/. docs/courses/ 2>/dev/null || true
          cp -r _kb/labs/. docs/labs/ 2>/dev/null || true
          cp -r _kb/interview-prep/. docs/interview-prep/ 2>/dev/null || true
          cp -r _kb/projects/. docs/projects/ 2>/dev/null || true
          cp -r _kb/cheatsheets/. docs/cheatsheets/ 2>/dev/null || true
          cp -r _kb/roadmap/. docs/roadmap/ 2>/dev/null || true
          cp -r _kb/blog/. docs/blog/ 2>/dev/null || true
          echo "========================"
          echo "✅ Content mounted successfully."

      # ── Build ─────────────────────────────────────────────────
      - name: Build MkDocs site
        env:
          ENABLE_GIT_DATES: "false"
          ENABLE_MINIFY: "true"
        run: mkdocs build

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
